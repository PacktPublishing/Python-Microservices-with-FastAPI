[project]
name = "api-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "httpx>=0.28.1",
    "pydantic[email]>=2.12.5",
    "dependency-injector>=4.45.0",
    "pyyaml>=6.0.0",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
    "ty>=0.0.18",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]

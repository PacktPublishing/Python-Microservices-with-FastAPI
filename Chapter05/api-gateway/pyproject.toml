[project]
name = "api-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "httpx>=0.28.1",
    "pydantic[email]>=2.12.5",
]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
    "ty>=0.0.14",
]

[tool.ruff]
line-length = 66

[tool.ruff.lint]
select = ["I", "E4", "E7", "F", "Q"]

[tool.pytest.ini_options]
pythonpath = ["."]

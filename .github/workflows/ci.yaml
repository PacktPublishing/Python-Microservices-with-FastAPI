name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Run type checker
        run: uv run ty check || true

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: platform-home
            path: Chapter01/platform-home
          - name: parents-portal
            path: Chapter02/parents-portal
          - name: reservation-service
            path: Chapter03/reservation-service
          - name: quote-service
            path: Chapter04/quote-service
          - name: api-gateway
            path: Chapter05/api-gateway
          - name: sitters-catalog
            path: Chapter07/sitters-catalog

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Run pytest (${{ matrix.name }})
        run: |
          if [ -d "tests" ] || find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            uv run pytest -v
          else
            echo "No tests found in ${{ matrix.path }}"
          fi

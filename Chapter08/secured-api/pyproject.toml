[project]
name = "secured-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.135.3",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.12.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.10",
    "ty>=0.0.29",
]

[tool.ruff]
line-length = 61

[tool.ruff.lint]
select = ["I", "E", "F", "Q", "UP", "FAST", "ARG"]

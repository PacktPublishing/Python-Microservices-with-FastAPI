[project]
name = "authenticator-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Giunio", email = "giuniodl@live.it" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.139.2",
    "itsdangerous>=2.2.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project]
name = "reservation-service"
version = "0.1.0"
description = "Reservation Service for Babysitting Application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
    "ty>=0.0.9",
]


[tool.ruff.lint.isort]
known-first-party = ["domain", "application", "infrastructure", "presentation"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.fastapi]
entrypoint = "presentation.main:app"

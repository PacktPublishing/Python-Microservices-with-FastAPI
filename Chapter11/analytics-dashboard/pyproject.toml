[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "analytics-dashboard"
version = "0.1.0"
description = "Chapter 11, Exercise 11.1: a NiceGUI dashboard for the analytics API"
requires-python = ">=3.13"
dependencies = [
    "httpx2>=2.16.0",
    "loguru>=0.7.3",
    "nicegui>=3.0.0",
    "pydantic-settings>=2.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.12.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["COM812"]

[tool.ruff.lint.isort]
known-first-party = []

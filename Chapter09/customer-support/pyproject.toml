[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "customer-support"
version = "0.1.0"
description = "Chapter 9: Building a Customer Support Chatbot with Generative AI "
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.143.5",
    "loguru>=0.7.3",
    "pydantic-ai>=2.57.0",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
    "ruff>=0.12.2",
]

[tool.pytest.ini_options]
pythonpath = "."

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = []

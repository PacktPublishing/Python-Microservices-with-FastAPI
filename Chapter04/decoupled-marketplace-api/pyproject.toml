[project]
name = "decoupled-marketplace-api"
version = "0.1.0"
description = "Babysitting Marketplace API - Dependency Injection Patterns"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.122.0",
    "dependency-injector>=4.48.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.7",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"

[tool.ruff]
line-length = 66

[tool.ruff.lint]
select = ["I", "E4", "E7", "E9", "F", "Q"]

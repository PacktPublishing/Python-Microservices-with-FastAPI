[project]
name = "sitters-catalog"
version = "0.1.0"
description = "Babysitter catalog API — FastAPI with MongoDB and TinyDB"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pymongo>=4.12.0",
    "pydantic-settings>=2.14.2",
    "tinydb>=4.8.0",
]

[tool.fastapi]
entrypoint = "main:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.8",
    "ty>=0.0.26",
]

[tool.ruff]
line-length = 66

[tool.ruff.lint]
select = ["I", "E", "F", "Q", "UP", "FAST", "ARG"]
